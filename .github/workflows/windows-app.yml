name: Windows app
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_app.py'
      - 'native_app.py'
      - 'native_connection.py'
      - 'tests/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/build_native_windows.ps1'
      - 'requirements-build.txt'
      - 'requirements-native.txt'
      - '.github/workflows/windows-app.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -q
      - run: ./scripts/build_windows.ps1
      - name: Test the executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'h0-exe-smoke.json'
          $process = Start-Process -FilePath './dist/H0-Control-Desk.exe' -ArgumentList '--smoke-test',"`"$report`"" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { throw 'Executable test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Executable test failed' }
          if (-not (Get-Content -LiteralPath $report | ConvertFrom-Json).passed) { throw 'Executable report failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: H0-Control-Desk-Windows-x64
          path: dist/H0-Control-Desk.exe
      - run: python -m pip install -r requirements-native.txt
      - run: ./scripts/build_native_windows.ps1
      - name: Test embedded app window
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'h0-native-smoke.json'
          $process = Start-Process -FilePath './dist/H0-Control-Desk-Native.exe' -ArgumentList '--smoke-test',"`"$report`"" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { throw 'Embedded executable test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Embedded executable test failed' }
          if (-not (Get-Content -LiteralPath $report | ConvertFrom-Json).passed) { throw 'Embedded executable report failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: H0-Control-Desk-Native-Windows-x64
          path: dist/H0-Control-Desk-Native.exe
