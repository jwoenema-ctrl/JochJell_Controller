name: Windows app
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop_app.py'
      - 'native_app.py'
      - 'native_connection.py'
      - 'tests/**'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/build_native_windows.ps1'
      - 'requirements-build.txt'
      - 'requirements-native.txt'
      - '.github/workflows/windows-app.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Run unittest suite
        shell: pwsh
        run: |
          $output = & python -m unittest discover -s tests -q 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object -FilePath unittest.log
          if ($status -ne 0) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## unittest failure'
            Get-Content -LiteralPath unittest.log | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            foreach ($line in Get-Content -LiteralPath unittest.log) {
              if ($line -match 'FAIL|ERROR|Traceback|AssertionError') {
                Write-Output "::error file=tests,line=1::$line"
              }
            }
            exit $status
          }
      - run: ./scripts/build_windows.ps1
      - name: Test the executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'jochjell-exe-smoke.json'
          $process = Start-Process -FilePath './dist/JochJell-Controller.exe' -ArgumentList '--smoke-test',"`"$report`"" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { throw 'Executable test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Executable test failed' }
          if (-not (Get-Content -LiteralPath $report | ConvertFrom-Json).passed) { throw 'Executable report failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: JochJell-Controller-Windows-x64
          path: dist/JochJell-Controller.exe
      - run: python -m pip install -r requirements-native.txt
      - run: ./scripts/build_native_windows.ps1
      - name: Test embedded app window
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'jochjell-native-smoke.json'
          $process = Start-Process -FilePath './dist/JochJell-Controller-Native.exe' -ArgumentList '--smoke-test',"`"$report`"" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { throw 'Embedded executable test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Embedded executable test failed' }
          if (-not (Get-Content -LiteralPath $report | ConvertFrom-Json).passed) { throw 'Embedded executable report failed' }
      - name: Package embedded Windows app
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath './dist/JochJell-Controller-Native.exe','./docs/WINDOWS_NATIVE.txt','./docs/WLAN_10814.md' -DestinationPath './dist/JochJell-Controller-Native-Windows-x64.zip' -Force
          $files = @(
            './dist/JochJell-Controller-Native.exe'
            './dist/JochJell-Controller-Native-Windows-x64.zip'
          )
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), [System.IO.Path]::GetFileName($file)
          }
          $checksums | Set-Content -LiteralPath './dist/SHA256SUMS.txt' -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: JochJell-Controller-Native-Windows-x64
          path: |
            dist/JochJell-Controller-Native.exe
            dist/JochJell-Controller-Native-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JochJell-Controller-Native-Windows-x64
          path: dist
      - name: Publish standalone Windows release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/JochJell-Controller-Native.exe
            dist/JochJell-Controller-Native-Windows-x64.zip
            dist/SHA256SUMS.txt
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "JochJell Controller $GITHUB_REF_NAME standalone Windows release with Roco 10814 WLAN support." --title "JochJell Controller $GITHUB_REF_NAME"
