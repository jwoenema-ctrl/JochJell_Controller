name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q 2>&1 | tee unittest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "## unittest failure" >> "$GITHUB_STEP_SUMMARY"
            cat unittest.log >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              case "$line" in
                *FAIL*|*ERROR*|*Traceback*|*AssertionError*) echo "::error file=tests,line=1::$line" ;;
              esac
            done < unittest.log
            exit "$status"
          fi
      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/scan_viewer.js
      - name: Run viewer regression tests
        run: node --test tests/js/scan_viewer.test.js
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify browser workflows and responsive pages
        run: node tests/browser_smoke.cjs
        env:
          SCREENSHOT_DIR: artifacts/ui-verification
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: artifacts/ui-verification
          if-no-files-found: ignore
